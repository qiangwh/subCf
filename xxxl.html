<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我们的一周年</title>
    <style>
        /* 预设数字字体，如果本地没有文件则使用 monospace */
        @font-face {
            font-family: 'Digital-7';
            src: url('digital-7_mono.ttf') format('truetype');
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            color: #fff;
            overflow-x: hidden;
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            position: relative;
        }
        
        /* 背景装饰 */
        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }
        
        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle 2s infinite alternate;
        }
        
        @keyframes twinkle {
            from { opacity: 0.3; }
            to { opacity: 1; }
        }
        
        /* 画布样式 */
        #garden {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }
        
        /* 容器样式 */
        .container {
            position: relative;
            z-index: 10;
            max-width: 1000px;
            margin: 0 auto;
            padding: 2rem;
            text-align: center;
        }
        
        h1 {
            font-size: 3.5rem;
            margin: 2rem 0;
            background: linear-gradient(90deg, #ff9a9e, #fad0c4);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 2px 10px rgba(255,255,255,0.2);
        }
        
        .anniversary-date {
            font-family: 'Digital-7', 'Courier New', monospace;
            font-size: 1.8rem;
            margin-bottom: 3rem;
            color: #f8b195;
            background: rgba(0,0,0,0.3);
            display: inline-block;
            padding: 10px 20px;
            border-radius: 50px;
            border: 1px solid rgba(248, 177, 149, 0.3);
        }
        
        /* 这里的代码省略部分 CSS 以保持简洁，保持你原有的 Timeline 和 Photo 样式即可 */
        .message {
            max-width: 700px;
            margin: 0 auto 3rem;
            padding: 2rem;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            line-height: 2;
            font-size: 1.1rem;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .photo-gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 2rem;
        }

        .photo-item {
            height: 250px;
            border-radius: 15px;
            overflow: hidden;
            position: relative;
            border: 3px solid rgba(255,255,255,0.2);
        }

        .photo-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .photo-caption {
            position: absolute;
            bottom: 0;
            width: 100%;
            background: rgba(0,0,0,0.6);
            padding: 10px;
            font-size: 0.9rem;
        }
        
        /* 响应式 */
        @media (max-width: 600px) {
            h1 { font-size: 2rem; }
            .anniversary-date { font-size: 1.2rem; }
        }
    </style>
</head>
<body>
    <div class="stars"></div>
    <!-- 关键修复：从 div 改为 canvas -->
    <canvas id="garden"></canvas>
    
    <div class="container">
        <h1>我们的一周年</h1>
        <div class="anniversary-date" id="countdown">正在计算守护时间...</div>
        
        <div class="message">
            亲爱的，不知不觉我们已经一起走过了一整年。这一年里，每一个和你在一起的瞬间都弥足珍贵。感谢你的包容与爱。
        </div>

        <div class="photo-gallery">
            <!-- 使用了更稳定的 HTTPS 图片地址 -->
            <div class="photo-item">
                <img src="https://images.unsplash.com/photo-1511739001486-6bfe10ce785f?auto=format&fit=crop&w=400&q=80" alt="1">
                <div class="photo-caption">漫步街头</div>
            </div>
            <div class="photo-item">
                <img src="https://images.unsplash.com/photo-1518199266791-bd373292e47c?auto=format&fit=crop&w=400&q=80" alt="2">
                <div class="photo-caption">浪漫晚餐</div>
            </div>
            <div class="photo-item">
                <img src="https://images.unsplash.com/photo-1494972308255-02fb55ad2817?auto=format&fit=crop&w=400&q=80" alt="3">
                <div class="photo-caption">一起旅行</div>
            </div>
        </div>
    </div>

    <script>
        // 1. 创建星星背景
        function createStars() {
            const starsContainer = document.querySelector('.stars');
            for (let i = 0; i < 100; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                const size = Math.random() * 2 + 1;
                star.style.width = size + 'px';
                star.style.height = size + 'px';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.animationDelay = Math.random() * 5 + 's';
                starsContainer.appendChild(star);
            }
        }

        // 2. 实时倒计时
        function updateCountdown() {
            const anniversary = new Date(2023, 5, 15); // 2023年6月15日
            const now = new Date();
            const diff = now - anniversary;

            const d = Math.floor(diff / (1000 * 60 * 60 * 24));
            const h = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const m = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const s = Math.floor((diff % (1000 * 60)) / 1000);

            document.getElementById('countdown').innerHTML = 
                `第 <span style="color:#ff9a9e">${d}</span> 天 ${h} 小时 ${m} 分 ${s} 秒`;
        }

        // 3. 爱心 Canvas 动画
        const canvas = document.getElementById('garden');
        const ctx = canvas.getContext('2d');
        let points = [];
        let angle = 0;

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        // 心形公式
        function getHeartPoint(t) {
            let x = 16 * Math.pow(Math.sin(t), 3);
            let y = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);
            return { x: x * 15, y: -y * 15 }; // 放大倍数15
        }

        function draw() {
            ctx.fillStyle = 'rgba(26, 26, 46, 0.1)'; // 拖尾效果
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            if (angle < Math.PI * 2) {
                let p = getHeartPoint(angle);
                points.push({
                    x: p.x + canvas.width / 2,
                    y: p.y + canvas.height / 2 - 50,
                    alpha: 1
                });
                angle += 0.05;
            }

            ctx.fillStyle = '#ff9a9e';
            points.forEach((p, i) => {
                ctx.beginPath();
                ctx.arc(p.x, p.y, 2, 0, Math.PI * 2);
                ctx.fill();
            });

            requestAnimationFrame(draw);
        }

        window.addEventListener('resize', resize);
        resize();
        createStars();
        setInterval(updateCountdown, 1000);
        draw();
    </script>
</body>
</html>
