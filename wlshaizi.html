<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>双人掷骰 - 同时摇比大小</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            color: white;
            overflow-x: hidden;
            padding-bottom: 30px;
        }
        .header {
            text-align: center;
            padding: 20px;
            background: rgba(0,0,0,0.2);
            margin-bottom: 20px;
        }
        .header h1 { font-size: 28px; text-shadow: 2px 2px 4px rgba(0,0,0,0.5); }
        .header p { margin-top: 10px; opacity: 0.9; }
        
        /* 新增全局掷骰按钮样式 */
        .global-roll {
            text-align: center;
            margin: 10px auto;
            max-width: 800px;
            padding: 0 20px;
        }
        .start-roll-btn {
            background: linear-gradient(45deg, #4ecdc4, #45b7d1);
            border: none;
            color: white;
            padding: 15px 40px;
            font-size: 20px;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
            transition: all 0.3s;
            margin: 0 auto;
        }
        .start-roll-btn:hover:not(:disabled) {
            transform: scale(1.05);
            box-shadow: 0 8px 25px rgba(0,0,0,0.4);
        }
        .start-roll-btn:disabled {
            background: #666;
            cursor: not-allowed;
            opacity: 0.5;
        }
        
        .battle-arena {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 800px;
            margin: 20px auto;
            padding: 0 20px;
            position: relative;
        }
        
        .vs-badge {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            background: #ff6b6b;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            z-index: 10;
            border: 3px solid white;
        }
        
        .player-zone {
            flex: 1;
            max-width: 300px;
            text-align: center;
            padding: 20px;
        }
        
        .player-card {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px 20px;
            border: 3px solid transparent;
            transition: all 0.3s;
        }
        
        .player-card.winner {
            border-color: #ffd700;
            background: rgba(255,215,0,0.2);
            box-shadow: 0 0 30px rgba(255,215,0,0.4);
            animation: pulse 2s infinite;
        }
        
        .player-card.loser {
            opacity: 0.7;
            transform: scale(0.95);
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        
        .player-name {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        
        .dice-display {
            width: 120px;
            height: 120px;
            background: white;
            border-radius: 24px;
            margin: 20px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 60px;
            color: #333;
            box-shadow: 0 8px 0 #ddd, 0 15px 20px rgba(0,0,0,0.3);
            transition: all 0.3s;
            position: relative;
        }
        
        .dice-display.rolling {
            animation: shake 0.5s infinite;
            background: linear-gradient(45deg, #fff 0%, #f0f0f0 100%);
        }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0) rotate(0deg); }
            25% { transform: translateX(-10px) rotate(-10deg); }
            75% { transform: translateX(10px) rotate(10deg); }
        }
        
        .status-text {
            margin-top: 10px;
            font-size: 14px;
            opacity: 0.8;
            height: 20px;
        }
        
        .result-area {
            text-align: center;
            padding: 20px;
            min-height: 80px;
            max-width: 800px;
            margin: 0 auto;
        }
        
        .result-text {
            font-size: 32px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.5s;
        }
        
        .result-text.show {
            opacity: 1;
            transform: translateY(0);
        }
        
        .reset-btn {
            background: rgba(255,255,255,0.2);
            border: 2px solid white;
            color: white;
            padding: 10px 30px;
            font-size: 16px;
            border-radius: 25px;
            cursor: pointer;
            margin-top: 20px;
            transition: all 0.3s;
        }
        
        .reset-btn:hover {
            background: white;
            color: #2a5298;
        }
        
        .score-board {
            display: flex;
            justify-content: center;
            gap: 50px;
            margin: 20px auto;
            font-size: 18px;
            max-width: 800px;
        }
        
        .score-item { 
            text-align: center; 
            background: rgba(0,0,0,0.1);
            padding: 10px 20px;
            border-radius: 15px;
            min-width: 120px;
        }
        .score-number {
            font-size: 36px;
            font-weight: bold;
            color: #ffd700;
            margin: 5px 0;
        }
        
        /* 移动端适配 */
        @media (max-width: 600px) {
            .battle-arena { 
                flex-direction: column; 
                gap: 40px; 
                margin: 10px auto;
            }
            .vs-badge { 
                position: relative; 
                transform: none; 
                left: auto; 
                top: auto; 
                margin: 10px auto; 
            }
            .player-zone { 
                max-width: 100%; 
                width: 100%; 
            }
            .score-board {
                gap: 20px;
                padding: 0 20px;
            }
            .result-text {
                font-size: 24px;
            }
            .start-roll-btn {
                padding: 12px 30px;
                font-size: 18px;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🎲 两人掷骰比大小 🎲</h1>
        <p>点击按钮双骰同时摇 | 快捷键：空格(掷骰/重置)</p >
    </div>

    <div class="score-board">
        <div class="score-item">
            <div>玩家 A</div>
            <div class="score-number" id="scoreA">0</div>
            <div style="font-size:12px;opacity:0.7">连胜次数</div>
        </div>
        <div class="score-item">
            <div>玩家 B</div>
            <div class="score-number" id="scoreB">0</div>
            <div style="font-size:12px;opacity:0.7">连胜次数</div>
        </div>
    </div>

    <!-- 新增全局同时掷骰按钮 -->
    <div class="global-roll">
        <button class="start-roll-btn" id="startRollBtn" onclick="rollBothDice()">
            🎲 双骰同时掷出
        </button>
    </div>

    <div class="battle-arena">
        <div class="player-zone">
            <div class="player-card" id="cardA">
                <div class="player-name">👤 玩家 A</div>
                <div class="dice-display" id="diceA">❓</div>
                <div class="status-text" id="statusA">等待掷骰</div>
            </div>
        </div>

        <div class="vs-badge">VS</div>

        <div class="player-zone">
            <div class="player-card" id="cardB">
                <div class="player-name">👤 玩家 B</div>
                <div class="dice-display" id="diceB">❓</div>
                <div class="status-text" id="statusB">等待掷骰</div>
            </div>
        </div>
    </div>

    <div class="result-area">
        <div class="result-text" id="resultText"></div>
        <button class="reset-btn" id="resetBtn" onclick="resetRound()" style="display:none;">
            再来一局 ↻
        </button>
    </div>

    <script>
        let gameState = {
            A: { value: null, rolled: false, rolling: false },
            B: { value: null, rolled: false, rolling: false },
            gameOver: false // 标记本局是否结束
        };
        let scores = { A: 0, B: 0 };
        const startBtn = document.getElementById('startRollBtn');
        const resetBtn = document.getElementById('resetBtn');

        // 核心：同时掷两个骰子
        function rollBothDice() {
            if (gameState.gameOver || gameState.A.rolling || gameState.B.rolling) return;
            
            // 禁用掷骰按钮，标记滚动状态
            startBtn.disabled = true;
            gameState.A.rolling = true;
            gameState.B.rolling = true;
            
            // 初始化A/B骰子滚动
            initRoll('A');
            initRoll('B');

            // 模拟滚动时长（800ms），同时结束滚动并判定结果
            setTimeout(() => {
                const valA = finishRoll('A');
                const valB = finishRoll('B');
                gameState.A.value = valA;
                gameState.B.value = valB;
                gameState.gameOver = true; // 本局结束
                setTimeout(showResult, 300); // 延迟展示结果，提升体验
            }, 800);
        }

        // 初始化骰子滚动动画
        function initRoll(player) {
            const diceEl = document.getElementById(`dice${player}`);
            const statusEl = document.getElementById(`status${player}`);
            diceEl.classList.add('rolling');
            diceEl.textContent = Math.floor(Math.random() * 6) + 1;
            statusEl.textContent = '摇骰中...';
            
            // 快速切换数字模拟滚动
            let rollTimes = 0;
            const rollInterval = setInterval(() => {
                if (rollTimes >= 12) {
                    clearInterval(rollInterval);
                    return;
                }
                diceEl.textContent = Math.floor(Math.random() * 6) + 1;
                rollTimes++;
            }, 60);
        }

        // 结束滚动，生成最终点数
        function finishRoll(player) {
            const finalValue = Math.floor(Math.random() * 6) + 1;
            const diceEl = document.getElementById(`dice${player}`);
            const statusEl = document.getElementById(`status${player}`);
            
            diceEl.classList.remove('rolling');
            diceEl.textContent = finalValue;
            statusEl.textContent = `掷出了 ${finalValue} 点`;
            
            gameState[player].rolling = false;
            gameState[player].rolled = true;
            return finalValue;
        }

        // 展示结果并更新连胜
        function showResult() {
            const valA = gameState.A.value;
            const valB = gameState.B.value;
            const resultEl = document.getElementById('resultText');
            const cardA = document.getElementById('cardA');
            const cardB = document.getElementById('cardB');
            
            let resultHTML = '';
            // 判定胜负
            if (valA > valB) {
                resultHTML = `🏆 玩家 A 获胜！<br><small>${valA} > ${valB}</small>`;
                cardA.classList.add('winner');
                cardB.classList.add('loser');
                scores.A++;
                scores.B = 0; // 失败方连胜重置
            } else if (valB > valA) {
                resultHTML = `🏆 玩家 B 获胜！<br><small>${valB} > ${valA}</small>`;
                cardB.classList.add('winner');
                cardA.classList.add('loser');
                scores.B++;
                scores.A = 0; // 失败方连胜重置
            } else {
                resultHTML = `🤝 平局！<br><small>都是 ${valA} 点</small>`;
                cardA.style.borderColor = '#4ecdc4';
                cardB.style.borderColor = '#4ecdc4';
                // 平局连胜数保留
            }
            // 更新计分板
            document.getElementById('scoreA').textContent = scores.A;
            document.getElementById('scoreB').textContent = scores.B;
            // 展示结果
            resultEl.innerHTML = resultHTML;
            resultEl.classList.add('show');
            // 隐藏掷骰按钮，显示重置按钮
            startBtn.style.display = 'none';
            resetBtn.style.display = 'inline-block';
        }

        // 重置本局
        function resetRound() {
            gameState = {
                A: { value: null, rolled: false, rolling: false },
                B: { value: null, rolled: false, rolling: false },
                gameOver: false
            };
            // 重置A/B样式和状态
            ['A', 'B'].forEach(p => {
                const diceEl = document.getElementById(`dice${p}`);
                const cardEl = document.getElementById(`card${p}`);
                const statusEl = document.getElementById(`status${p}`);
                diceEl.textContent = '❓';
                cardEl.classList.remove('winner', 'loser');
                cardEl.style.borderColor = 'transparent';
                statusEl.textContent = '等待掷骰';
            });
            // 重置结果和按钮
            document.getElementById('resultText').classList.remove('show');
            startBtn.disabled = false;
            startBtn.style.display = 'block';
            resetBtn.style.display = 'none';
        }

        // 键盘快捷键：空格 = 掷骰（未结束）/ 重置（已结束）
        document.addEventListener('keydown', (e) => {
            if (e.key === ' ') {
                e.preventDefault();
                if (gameState.gameOver) {
                    resetRound();
                } else {
                    rollBothDice();
                }
            }
        });
    </script>
</body>
</html>
